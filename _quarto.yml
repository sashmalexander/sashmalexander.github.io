# This file controls the settings for your Quarto template from www.marvinschmitt.com

# website settings
website:
  title: "Sasha Alexander"
  description: "PhD student at Case Western Reserve University studying heart brain dynamics and imaging"
  image: img/frontimage.jpg

  favicon: img/favicon.png

  # start of the navigation bar at the top of the website
  navbar:
    pinned: true

    # your sub-pages
    left:
      - text: "Research"
        href: projects/index.qmd
      - text: "CV"
        href: cv/index.qmd

    # your social media handles
    right:
      - icon: github
        href: https://github.com/sashmalexander
      - icon: envelope
        aria-label: email
        href: "mailto:sxa1829@case.edu"

# Don't touch unless you know what you are doing :) ------------
  search:
    location: navbar
    type: textbox
  page-footer:
    left: |
      <span class="faux-block">&#169; 2026 Sasha Alexander</span>
    center: |
      <span class="faux-block">Built with <a href="https://quarto.org">Quarto</a></span>
    right: |
      <span class="faux-block">Template by <a href="https://www.marvinschmitt.com/blog/website-tutorial-quarto/">Marvin Schmitt</a></span>

project:
  type: website
  output-dir: docs

  preview:
    port: 22222
    browser: true
    watch-inputs: true
    navigate: true

execute:
  freeze: true

format:
  html:
    fontsize: 1.1em
    theme:
      - pulse
      - html/styles.scss
    toc: false
    code-link: true
    anchor-sections: true
    fig-cap-location: margin
    reference-location: margin
    footnotes-hover: true
